name: Mayhem
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CHONO_MAYHEMFILE: Mayhem/chono.mayhemfile
  FLOAT_MAYHEMFILE: Mayhem/flaot.mayhemfile
  NAMED_MAYHEMFILE: Mayhem/named.mayhemfile
  ONEAGR_MAYHEMFILE: Mayhem/one-agr.mayhemfile
  TIMEPOINT_MAYHEMFILE: Mayhem/timepoint.mayhemfile
  TWOARG_MAYHEMFILE: Mayhem/two-agr.mayhemfile

jobs:
  build:
    name: ${{ matrix.os }} shared=${{ matrix.shared }} ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        shared: [false]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            triplet: x64-linux

    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  
      - name: Start analysis for set
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }} --file ${{ env.ONEAGR_MAYHEMFILE }} --duration 300
  
      - name: Start analysis for set
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }} --file ${{ env.TIMEPOINT_MAYHEMFILE }} --duration 300
  
      - name: Start analysis for set
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }} --file ${{ env.TWOARG_MAYHEMFILE }} --duration 300

      - name: Start analysis for arena
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }} --file ${{ env.CHONO_MAYHEMFILE }} --duration 300

      - name: Start analysis for map
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }} --file ${{ env.FLOAT_MAYHEMFILE }} --duration 300

      - name: Start analysis for set
        uses: ForAllSecure/mcode-action@long-runs
        with:
          mayhem-token: ${{ secrets.MAYHEM_TOKEN }}
          args: --image ${{ steps.meta.outputs.tags }} --file ${{ env.NAMED_MAYHEMFILE }} --duration 300

